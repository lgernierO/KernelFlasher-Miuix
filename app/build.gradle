plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.devtools.ksp)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.kotlin.serialization)
}

def signingEnvironment = [
    keystore: providers.environmentVariable('SIGNING_KEYSTORE_PATH').orNull,
    storePassword: providers.environmentVariable('SIGNING_STORE_PASSWORD').orNull,
    keyAlias: providers.environmentVariable('SIGNING_KEY_ALIAS').orNull,
    keyPassword: providers.environmentVariable('SIGNING_KEY_PASSWORD').orNull,
]
def hasSigningEnvironment = signingEnvironment.values().any { it != null && !it.isBlank() }
def hasCompleteSigningEnvironment = signingEnvironment.values().every { it != null && !it.isBlank() }
if (hasSigningEnvironment && !hasCompleteSigningEnvironment) {
    throw new GradleException('Set all four SIGNING_* environment variables to use a signing key.')
}
def signingKeystore = hasCompleteSigningEnvironment ? rootProject.file(signingEnvironment.keystore) : null
if (signingKeystore != null && !signingKeystore.isFile()) {
    throw new GradleException('SIGNING_KEYSTORE_PATH must point to an existing keystore.')
}

android {
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId "com.github.curiousnom.kernelflasher"
        minSdk 29
        targetSdk 35
        versionCode 200
        versionName "2.0.0"

        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters = ['armeabi-v7a', 'arm64-v8a']
        }
        vectorDrawables {
            useSupportLibrary true
        }
    }
    signingConfigs {
        shared {
            if (hasCompleteSigningEnvironment) {
                storeFile signingKeystore
                storePassword signingEnvironment.storePassword
                keyAlias signingEnvironment.keyAlias
                keyPassword signingEnvironment.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig hasCompleteSigningEnvironment ? signingConfigs.shared : signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig hasCompleteSigningEnvironment ? signingConfigs.shared : signingConfigs.debug
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
    buildFeatures {
        aidl true
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
    namespace 'com.github.curiousnom.kernelflasher'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
}

dependencies {
